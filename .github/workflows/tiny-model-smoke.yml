name: Tiny model computational smoke
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-smoke.txt
      - run: python -m pytest -q tests/test_training_smoke.py tests/test_training_progress.py tests/test_data_converter.py tests/test_dataset_loader.py tests/test_checkpointer.py tests/test_experiment_checkpoint.py tests/test_eval_split.py tests/test_cli_safety.py
        env:
          JAX_PLATFORMS: cpu
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
