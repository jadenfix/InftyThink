name: Tiny model computational smoke
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jax[cpu]==0.4.30' 'flax==0.10.0' 'optax==0.2.3' numpy scipy tqdm pytest
      - run: python -m pytest -q tests/test_training_smoke.py
        env:
          JAX_PLATFORMS: cpu
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
